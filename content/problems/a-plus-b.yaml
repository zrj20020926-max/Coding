slug: a-plus-b
title: 边界求和
description: 读取两个整数，输出它们的和。结果可能超出 32 位有符号整数范围。
difficulty: easy
tags:
- basic-io
- math
input_description: 一行包含两个整数 `a b`。
output_description: 输出一个整数 `a+b`。
data_constraints: '`-10^18 <= a,b <= 10^18`，且答案保证在 64 位有符号整数范围内。'
sample_input: '7 -3

  '
sample_output: '4

  '
sample_explanation: 七与负三相加得到四。
time_limit_ms: 1000
memory_limit_mb: 128
source: CodeArena 原创题库
publish: true
