slug: array-total
title: 长数组总和
description: 给定一个整数数组，计算所有元素之和。需要使用足够大的整数类型保存答案。
difficulty: easy
tags:
- basic-io
- array
input_description: 第一行一个整数 `n`，第二行 `n` 个整数。
output_description: 输出数组元素总和。
data_constraints: '`1 <= n <= 20000`，`-10^9 <= a_i <= 10^9`。'
sample_input: '5

  1 2 -3 4 5

  '
sample_output: '9

  '
sample_explanation: 依次累加得到九。
time_limit_ms: 1000
memory_limit_mb: 128
source: CodeArena 原创题库
publish: true
reference_solutions:
  python: reference-solutions/array-total/solution.py
  cpp: reference-solutions/array-total/solution.cpp
