slug: kth-pair-distance
title: 第 K 小数对距离
description: 所有下标对 i<j 的距离定义为绝对差，求这些距离从小到大排序后的第 k 个。
difficulty: hard
tags:
- binary-search
- two-pointers
- sorting
input_description: 第一行 `n k`，第二行 n 个整数。
output_description: 输出第 k 小距离。
data_constraints: '`2 <= n <= 200000`，`1 <= k <= n(n-1)/2`，元素绝对值不超过 `10^9`。'
sample_input: '4 4

  1 3 6 10

  '
sample_output: '5

  '
sample_explanation: 六个距离为 2,3,4,5,7,9，第四小为五。
time_limit_ms: 2600
memory_limit_mb: 256
source: CodeArena 原创题库
publish: true
reference_solutions:
  python: reference-solutions/kth-pair-distance/solution.py
  cpp: reference-solutions/kth-pair-distance/solution.cpp
