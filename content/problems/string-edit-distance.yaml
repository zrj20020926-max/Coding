    output_file: string-edit-distance/03.out
  - sequence: 4
    score: 20
    scenario: special_structure
    scenario_description: 特殊结构：验证 字符串编辑距离 在该类输入下的正确性。
    input_file: string-edit-distance/04.in
    output_file: string-edit-distance/04.out
  - sequence: 5
    score: 20
    scenario: performance
    scenario_description: 极值或性能压力：验证 字符串编辑距离 在该类输入下的正确性。
