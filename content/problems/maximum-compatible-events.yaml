slug: maximum-compatible-events
title: 最多可参加活动
description: 每个活动占用半开区间 `[start,end)`，同一时刻只能参加一个活动，求最多可完整参加多少个。
difficulty: medium
tags:
- greedy
- interval
input_description: 第一行 `n`，随后每行 `start end`。
output_description: 输出最多活动数。
data_constraints: '`1 <= n <= 200000`，`0 <= start < end <= 10^9`。'
sample_input: '5

  1 4

  3 5

  0 6

  5 7

  7 8

  '
sample_output: '3

  '
sample_explanation: 选择 1-4、5-7、7-8 共三个活动。
time_limit_ms: 1500
memory_limit_mb: 256
source: CodeArena 原创题库
publish: true
reference_solutions:
  python: reference-solutions/maximum-compatible-events/solution.py
  cpp: reference-solutions/maximum-compatible-events/solution.cpp
test_set:
  version: 1
  checker_type: exact
  cases:
