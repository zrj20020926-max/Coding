slug: merge-intervals
title: 闭区间合并
description: 合并所有相交或端点相接的闭区间，并按左端点递增输出。
difficulty: medium
tags:
- interval
- sorting
input_description: 第一行 `n`，随后 `n` 行为 `l r`。
output_description: 先输出合并后数量，再逐行输出区间。
data_constraints: '`1 <= n <= 200000`，`-10^9 <= l <= r <= 10^9`。'
sample_input: '4

  1 3

  2 6

  8 10

  10 12

  '
sample_output: '2

  1 6

  8 12

  '
sample_explanation: 前两个合并为 1 到 6，后两个在端点十相接，合并为 8 到 12。
time_limit_ms: 1500
memory_limit_mb: 256
source: CodeArena 原创题库
publish: true
reference_solutions:
  python: reference-solutions/merge-intervals/solution.py
  cpp: reference-solutions/merge-intervals/solution.cpp
