slug: queue-commands
title: 窗口服务队列
description: 维护一个先进先出的整数队列，按顺序执行入队、出队、查看队首和查询长度操作。
difficulty: easy
tags:
- queue
- simulation
input_description: 第一行操作数 `q`。随后每行是 `push x`、`pop`、`front` 或 `size`。
output_description: 对后三类操作输出结果；空队列的 `pop/front` 输出 `EMPTY`。
data_constraints: '`1 <= q <= 100000`，`|x| <= 10^9`。'
sample_input: '7

  push 3

  push 5

  front

  pop

  size

  pop

  pop

  '
sample_output: '3

  3

  1

  5

  EMPTY

  '
sample_explanation: 队首先为三；弹出三后剩一个元素，最后一次弹出时队列为空。
time_limit_ms: 1200
memory_limit_mb: 128
source: CodeArena 原创题库
publish: true
reference_solutions:
  python: reference-solutions/queue-commands/solution.py
  cpp: reference-solutions/queue-commands/solution.cpp
