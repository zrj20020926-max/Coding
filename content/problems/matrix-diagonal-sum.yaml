slug: matrix-diagonal-sum
title: 交叉对角线之和
description: 计算方阵主对角线与副对角线上所有不同单元格的和。奇数阶中心格只能计算一次。
difficulty: easy
tags:
- matrix
- basic-io
input_description: 第一行 `n`，随后 `n` 行每行 `n` 个整数。
output_description: 输出交叉对角线元素和。
data_constraints: '`1 <= n <= 1000`，元素绝对值不超过 `10^9`。'
sample_input: '3

  1 2 3

  4 5 6

  7 8 9

  '
sample_output: '25

  '
sample_explanation: 两条对角线为 1,5,9 与 3,5,7，中心五只计一次，总和二十五。
time_limit_ms: 1200
memory_limit_mb: 128
source: CodeArena 原创题库
publish: true
reference_solutions:
  python: reference-solutions/matrix-diagonal-sum/solution.py
  cpp: reference-solutions/matrix-diagonal-sum/solution.cpp
