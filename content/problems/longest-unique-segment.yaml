slug: longest-unique-segment
title: 最长无重复片段
description: 求数组中不含重复值的最长连续子数组长度。
difficulty: medium
tags:
- sliding-window
- hash-table
input_description: 第一行 `n`，第二行 `n` 个整数。
output_description: 输出最长长度。
data_constraints: '`1 <= n <= 200000`，元素绝对值不超过 `10^9`。'
sample_input: '8

  1 2 3 2 4 5 4 6

  '
sample_output: '4

  '
sample_explanation: 片段 1,2,3 长三，片段 2,4,5 长三，没有更长片段。
time_limit_ms: 1500
memory_limit_mb: 256
source: CodeArena 原创题库
publish: true
reference_solutions:
  python: reference-solutions/longest-unique-segment/solution.py
  cpp: reference-solutions/longest-unique-segment/solution.cpp
