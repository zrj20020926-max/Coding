slug: js-acm-output-output-limit-contract
title: 输出限制处理
description: '本练习专门训练 **输出限制处理**，计算本身保持简单，重点是 stdout 格式。


  ### 正确示例


  使用可见空白符表示为：`1↵

  2↵

  3↵

  4↵

  5↵

  `。


  ### 常见错误示例


  `debug:␠1↵

  2↵

  3↵

  4↵

  5↵

  ` 会因为包含额外调试前缀而得到 Wrong Answer。


  ### exact checker 规则


  CRLF 与 LF 等价；每行行尾空格和最终空白会被忽略。行内多余空格、内部空行、TAB/空格混用和额外调试行仍会被识别。缺少最后一个换行符可以通过。'
difficulty: hard
training_category: output-format
tags:
- stdout
- output-format
- javascript-v8
- nodejs
input_description: 输入一个非负整数 n，表示需要产生的结果数量。
output_description: 精确输出要求：n 不超过 10000 时逐行输出；超过时输出 OUTPUT_TOO_LARGE。
data_constraints: 输入为 UTF-8 文本；单个隐藏输入不超过 2 MB；单次标准输出必须低于平台 1 MB 上限。
sample_input: '5

  '
sample_output: '1

  2

  3

  4

  5

  '
sample_explanation: '输出可视化为 `1↵

  2↵

  3↵

  4↵

  5↵

  `。↵ 表示换行，␠ 表示空格，⇥ 表示 TAB。'
