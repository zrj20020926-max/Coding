slug: js-acm-output-stdout-write-once
title: 使用 process.stdout.write()
description: '本练习专门训练 **使用 process.stdout.write()**，计算本身保持简单，重点是 stdout 格式。


  ### 正确示例


  使用可见空白符表示为：`2↵

  4↵

  6↵

  8↵

  10↵

  `。


  ### 常见错误示例


  `debug:␠2↵

  4↵

  6↵

  8↵

  10↵

  ` 会因为包含额外调试前缀而得到 Wrong Answer。


  ### exact checker 规则


  CRLF 与 LF 等价；每行行尾空格和最终空白会被忽略。行内多余空格、内部空行、TAB/空格混用和额外调试行仍会被识别。缺少最后一个换行符可以通过。'
difficulty: hard
training_category: output-format
tags:
- stdout
- output-format
- javascript-v8
- nodejs
input_description: 输入一个非负整数 n，表示需要产生的结果数量。
output_description: 精确输出要求：输出 1 到 n 的两倍，每行一个。
data_constraints: 输入为 UTF-8 文本；单个隐藏输入不超过 2 MB；单次标准输出必须低于平台 1 MB 上限。
sample_input: '5

  '
sample_output: '2

  4

  6

  8

  10

  '
sample_explanation: '输出可视化为 `2↵

  4↵

  6↵

  8↵

  10↵

  `。↵ 表示换行，␠ 表示空格，⇥ 表示 TAB。'
