slug: js-acm-output-group-multiple-lines
title: 每组输出多行
description: '本练习专门训练 **每组输出多行**，计算本身保持简单，重点是 stdout 格式。


  ### 正确示例


  使用可见空白符表示为：`3↵

  2↵

  7↵

  2↵

  `。


  ### 常见错误示例


  `debug:␠3↵

  2↵

  7↵

  2↵

  ` 会因为包含额外调试前缀而得到 Wrong Answer。


  ### exact checker 规则


  CRLF 与 LF 等价；每行行尾空格和最终空白会被忽略。行内多余空格、内部空行、TAB/空格混用和额外调试行仍会被识别。缺少最后一个换行符可以通过。'
difficulty: medium
training_category: output-format
tags:
- stdout
- output-format
- javascript-v8
- nodejs
input_description: 第一行给出测试组数 T，随后每行是一组待格式化的简单数据。
output_description: 精确输出要求：每组两行，相邻组直接衔接。
data_constraints: 输入为 UTF-8 文本；单个隐藏输入不超过 2 MB；单次标准输出必须低于平台 1 MB 上限。
sample_input: '2

  1 2

  3 4

  '
sample_output: '3

  2

  7

  2

  '
sample_explanation: '输出可视化为 `3↵

  2↵

  7↵

  2↵

  `。↵ 表示换行，␠ 表示空格，⇥ 表示 TAB。'
samples:
- input: '2

    1 2

    3 4

    '
  output: '3

    2

    7

    2

    '
  explanation: '输出可视化为 `3↵

    2↵

    7↵

    2↵

    `。↵ 表示换行，␠ 表示空格，⇥ 表示 TAB。'
- input: '3

    5

    1 2 3

    -1 -2

    '
  output: '5

    1

    6

    3

    -3

    2

    '
  explanation: '输出可视化为 `5↵

    1↵

    6↵

    3↵

    -3↵

    2↵

    `。↵ 表示换行，␠ 表示空格，⇥ 表示 TAB。'
learning_objective: 每组输出结果与元素个数两行。
v8_hint: 把所有结果先放入数组，使用 join 组成字符串后只调用一次 print(output)。print 会自动追加最终换行。
nodejs_hint: 少量结果可用 console.log；批量结果优先数组加 join，最后调用一次 process.stdout.write。
common_errors:
- 输出 result:、debug 等题目未要求的提示语。
- 把一个空格写成多个空格，或把换行写成空格。
- 在循环中逐次 console.log，造成大量系统调用和不合理超时。
- 直接调试打印 BigInt，出现不符合题意的 n 后缀。
- 混淆 TAB、反斜杠、引号等转义后的实际输出。
