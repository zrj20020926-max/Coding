  \ {\n  lines.push(line);\n}\n\n// TODO: 模板字符串\nconst output = '';\nprint(output);\n"
starter_code_nodejs: 'const fs = require(''fs'');


  const input = fs.readFileSync(0, ''utf8'');


  // TODO: 模板字符串

  const output = '''';

  process.stdout.write(`${output}\n`);

  '
