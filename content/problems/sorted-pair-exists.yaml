slug: sorted-pair-exists
title: 有序双数之和
description: 在非递减数组中判断是否存在两个不同位置的元素之和等于目标值。
difficulty: easy
tags:
- two-pointers
- array
input_description: 第一行 `n target`，第二行 `n` 个非递减整数。
output_description: 存在则输出 `YES`，否则输出 `NO`。
data_constraints: '`2 <= n <= 200000`，元素和目标值绝对值不超过 `10^18`。'
sample_input: '6 9

  1 2 3 4 7 10

  '
sample_output: 'YES

  '
sample_explanation: 二与七的和为九。
time_limit_ms: 1000
memory_limit_mb: 128
source: CodeArena 原创题库
publish: true
