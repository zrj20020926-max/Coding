slug: range-sum-queries
title: 静态区间求和
description: 对一个不再修改的数组回答多个闭区间元素和查询。
difficulty: medium
tags:
- prefix-sum
- array
input_description: 第一行 `n q`，第二行数组；随后 `q` 行给出一基下标 `l r`。
output_description: 每个查询输出一行区间和。
data_constraints: '`1 <= n,q <= 100000`，`1 <= l <= r <= n`，`|a_i| <= 10^9`。'
sample_input: '5 3

  2 -1 4 3 5

  1 3

  2 5

  4 4

  '
sample_output: '5

  11

  3

  '
sample_explanation: 三个区间的和分别为五、十一、三。
time_limit_ms: 1200
memory_limit_mb: 256
source: CodeArena 原创题库
publish: true
reference_solutions:
  python: reference-solutions/range-sum-queries/solution.py
  cpp: reference-solutions/range-sum-queries/solution.cpp
