slug: js-acm-two-lines-until-eof
title: 每组固定两行直到 EOF
description: 本练习只训练 **每组固定两行直到 EOF** 的 stdin 解析。计算步骤保持简单：按照输入结构读取数据，再输出题目要求的规范化结果。
difficulty: medium
training_category: read-until-eof
tags:
- stdin
- stdout
- read-until-eof
- javascript-v8
- nodejs
input_description: 每组固定两行，组数未知，读取到 EOF。
output_description: 每组用竖线连接两行后输出。 不得包含提示语或调试信息。
data_constraints: 输入为 UTF-8 文本；逻辑行使用 LF 或 CRLF。除 BigInt 专项外，整数绝对值不超过 10^9；普通练习输入不超过 10^5 个 token，大输入专项按题面可达到
  10^6 个 token。
sample_input: 'a

  b

  c

  d

  '
sample_output: 'a|b

  c|d

  '
sample_explanation: 按“每组固定两行直到 EOF”的规则解析输入，并得到上述规范化输出。
samples:
- input: 'a

    b

    c

    d

    '
  output: 'a|b

    c|d

    '
  explanation: 按“每组固定两行直到 EOF”的规则解析输入，并得到上述规范化输出。
- input: 'one

    two words

    '
  output: 'one|two words

    '
  explanation: 按“每组固定两行直到 EOF”的规则解析输入，并得到上述规范化输出。
learning_objective: 能够在两种 JavaScript ACM 运行模式中正确处理“每组固定两行直到 EOF”，并输出规范化结果。
v8_hint: 循环调用 `readline()`，并用 `line === undefined` 判断 EOF；空字符串不是 EOF。
nodejs_hint: 统一 CRLF 后建立行数组，用整数游标前进；不要用 `shift()` 消耗大数组。
common_errors:
- 在 JavaScript V8 模式中误用 require、process、fs 或 Buffer。
- 在 Node.js 模式中直接调用未定义的 readline() 或 print()。
- 无条件 trim() 导致空行、前导空格或末尾结构丢失。
- 使用 shift() 反复移动大数组，造成不必要的二次方开销。
chapter: js-acm-read-until-eof
chapter_order: 3
prerequisites:
- js-acm-pairs-until-eof
estimated_minutes: 8
starter_code_v8: "const lines = [];\nfor (let line = readline(); line !== undefined; line = readline())\
  \ {\n  lines.push(line);\n}\n\n// TODO: 每组固定两行直到 EOF\nprint(lines.length);\n"
starter_code_nodejs: 'const fs = require(''fs'');


  const input = fs.readFileSync(0, ''utf8'');

  const lines = input.replace(/\r\n/g, ''\n'').split(''\n'');


  // TODO: 每组固定两行直到 EOF；请按题意决定是否移除末尾空行

  console.log(lines.length);

  '
