slug: js-acm-different-field-types
title: 不同类型字段组合
description: 本练习只训练 **不同类型字段组合** 的 stdin 解析。计算步骤保持简单：按照输入结构读取数据，再输出题目要求的规范化结果。
difficulty: hard
training_category: mixed-input
tags:
- stdin
- stdout
- mixed-nested
- javascript-v8
- nodejs
input_description: 一行依次给字符串、整数、浮点数和剩余文本。
output_description: 按指定类型格式化为 name|int|float(1位)|text。 不得包含提示语或调试信息。
data_constraints: 输入为 UTF-8 文本；逻辑行使用 LF 或 CRLF。除 BigInt 专项外，整数绝对值不超过 10^9；普通练习输入不超过 10^5 个 token，大输入专项按题面可达到
  10^6 个 token。
sample_input: 'alice 18 95.5 hello world

  '
sample_output: 'alice|18|95.5|hello world

  '
sample_explanation: 按“不同类型字段组合”的规则解析输入，并得到上述规范化输出。
samples:
- input: 'alice 18 95.5 hello world

    '
  output: 'alice|18|95.5|hello world

    '
  explanation: 按“不同类型字段组合”的规则解析输入，并得到上述规范化输出。
- input: 'bob 0 -1.25 text

    '
  output: 'bob|0|-1.3|text

    '
  explanation: 按“不同类型字段组合”的规则解析输入，并得到上述规范化输出。
learning_objective: 能够在两种 JavaScript ACM 运行模式中正确处理“不同类型字段组合”，并输出规范化结果。
v8_hint: 按行读取后使用 token 或行游标；将输出先放入数组，最后用 `print(out.join('\n'))`。
nodejs_hint: 一次读取 stdin，使用索引游标组织 token/行；将输出缓存后一次写入 stdout。
common_errors:
- 在 JavaScript V8 模式中误用 require、process、fs 或 Buffer。
- 在 Node.js 模式中直接调用未定义的 readline() 或 print()。
- 只按单个空格 split(' ') 导致连续空白产生空 token。
- 使用 shift() 反复移动大数组，造成不必要的二次方开销。
chapter: js-acm-mixed-nested
chapter_order: 10
prerequisites:
- js-acm-command-stream
estimated_minutes: 8
starter_code_v8: "const lines = [];\nfor (let line = readline(); line !== undefined; line = readline())\
  \ {\n  lines.push(line);\n}\n\n// TODO: 不同类型字段组合\nprint(lines.length);\n"
starter_code_nodejs: 'const fs = require(''fs'');


  const input = fs.readFileSync(0, ''utf8'');

  const lines = input.replace(/\r\n/g, ''\n'').split(''\n'');


  // TODO: 不同类型字段组合；请按题意决定是否移除末尾空行

  console.log(lines.length);

  '
time_limit_ms: 1000
memory_limit_mb: 256
