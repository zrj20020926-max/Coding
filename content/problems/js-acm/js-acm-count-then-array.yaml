slug: js-acm-count-then-array
title: 第一行是数量，第二行是数组
description: 本练习只训练 **第一行是数量，第二行是数组** 的 stdin 解析。计算步骤保持简单：按照输入结构读取数据，再输出题目要求的规范化结果。
difficulty: easy
training_category: multi-line
tags:
- stdin
- stdout
- multi-line
- javascript-v8
- nodejs
input_description: 第一行整数 n；第二行至少包含 n 个整数。
output_description: 输出第二行前 n 个整数之和。 不得包含提示语或调试信息。
data_constraints: 输入为 UTF-8 文本；逻辑行使用 LF 或 CRLF。除 BigInt 专项外，整数绝对值不超过 10^9；普通练习输入不超过 10^5 个 token，大输入专项按题面可达到
  10^6 个 token。
sample_input: '3

  1 2 3

  '
sample_output: '6

  '
sample_explanation: 按“第一行是数量，第二行是数组”的规则解析输入，并得到上述规范化输出。
samples:
- input: '3

    1 2 3

    '
  output: '6

    '
  explanation: 按“第一行是数量，第二行是数组”的规则解析输入，并得到上述规范化输出。
- input: '5

    10 -2 0 4 8

    '
  output: '20

    '
  explanation: 按“第一行是数量，第二行是数组”的规则解析输入，并得到上述规范化输出。
learning_objective: 能够在两种 JavaScript ACM 运行模式中正确处理“第一行是数量，第二行是数组”，并输出规范化结果。
v8_hint: 循环调用 `readline()`，并用 `line === undefined` 判断 EOF；空字符串不是 EOF。
nodejs_hint: 统一 CRLF 后建立行数组，用整数游标前进；不要用 `shift()` 消耗大数组。
common_errors:
- 在 JavaScript V8 模式中误用 require、process、fs 或 Buffer。
- 在 Node.js 模式中直接调用未定义的 readline() 或 print()。
- 只按单个空格 split(' ') 导致连续空白产生空 token。
- 输出调试文字、额外空格或错误的分隔符导致 Wrong Answer。
chapter: js-acm-multi-line
chapter_order: 3
prerequisites:
- js-acm-fixed-three-lines
estimated_minutes: 8
starter_code_v8: "const lines = [];\nfor (let line = readline(); line !== undefined; line = readline())\
  \ {\n  lines.push(line);\n}\n\n// TODO: 第一行是数量，第二行是数组\nprint(lines.length);\n"
starter_code_nodejs: 'const fs = require(''fs'');


  const input = fs.readFileSync(0, ''utf8'');

  const lines = input.replace(/\r\n/g, ''\n'').split(''\n'');


  // TODO: 第一行是数量，第二行是数组；请按题意决定是否移除末尾空行

  console.log(lines.length);

  '
