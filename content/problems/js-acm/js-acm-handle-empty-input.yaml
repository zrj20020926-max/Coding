slug: js-acm-handle-empty-input
title: 空输入处理
description: 本练习只训练 **空输入处理** 的 stdin 解析。计算步骤保持简单：按照输入结构读取数据，再输出题目要求的规范化结果。
difficulty: easy
training_category: single-value
tags:
- stdin
- stdout
- single-value
- javascript-v8
- nodejs
input_description: 标准输入可能完全没有字节，也可能包含一行文本。
output_description: 无逻辑行时输出 EMPTY，否则输出第一行。 不得包含提示语或调试信息。
data_constraints: 输入为 UTF-8 文本；逻辑行使用 LF 或 CRLF。除 BigInt 专项外，整数绝对值不超过 10^9；普通练习输入不超过 10^5 个 token，大输入专项按题面可达到
  10^6 个 token。
sample_input: ''
sample_output: 'EMPTY

  '
sample_explanation: 按“空输入处理”的规则解析输入，并得到上述规范化输出。
samples:
- input: ''
  output: 'EMPTY

    '
  explanation: 按“空输入处理”的规则解析输入，并得到上述规范化输出。
- input: 'hello

    '
  output: 'hello

    '
  explanation: 按“空输入处理”的规则解析输入，并得到上述规范化输出。
learning_objective: 能够在两种 JavaScript ACM 运行模式中正确处理“空输入处理”，并输出规范化结果。
v8_hint: 调用一次 `readline()`；只有题意允许时才 `trim()`，空白 token 用 `/\s+/` 拆分。
nodejs_hint: 读取原始 stdin 后按题意处理第一行；不要在模板阶段无条件 `trim()`。
common_errors:
- 在 JavaScript V8 模式中误用 require、process、fs 或 Buffer。
- 在 Node.js 模式中直接调用未定义的 readline() 或 print()。
- 无条件 trim() 导致空行、前导空格或末尾结构丢失。
- 输出调试文字、额外空格或错误的分隔符导致 Wrong Answer。
chapter: js-acm-single-value
chapter_order: 8
prerequisites:
- js-acm-read-bigint
estimated_minutes: 8
starter_code_v8: "const lines = [];\nfor (let line = readline(); line !== undefined; line = readline())\
  \ {\n  lines.push(line);\n}\n\n// TODO: 空输入处理\nprint(lines.length);\n"
starter_code_nodejs: 'const fs = require(''fs'');


  const input = fs.readFileSync(0, ''utf8'');

  const lines = input.replace(/\r\n/g, ''\n'').split(''\n'');


  // TODO: 空输入处理；请按题意决定是否移除末尾空行

  console.log(lines.length);

  '
time_limit_ms: 1000
memory_limit_mb: 256
source: CodeArena JavaScript ACM 原创课程
publish: true
