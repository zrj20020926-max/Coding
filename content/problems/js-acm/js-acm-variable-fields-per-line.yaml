slug: js-acm-variable-fields-per-line
title: 每行字段数量不同
description: 本练习只训练 **每行字段数量不同** 的 stdin 解析。计算步骤保持简单：按照输入结构读取数据，再输出题目要求的规范化结果。
difficulty: easy
training_category: multi-line
tags:
- stdin
- stdout
- multi-line
- javascript-v8
- nodejs
input_description: 输入含若干行，每行字段数可以不同，空行字段数为 0。
output_description: 按行输出字段数量，数量之间一个空格。 不得包含提示语或调试信息。
data_constraints: 输入为 UTF-8 文本；逻辑行使用 LF 或 CRLF。除 BigInt 专项外，整数绝对值不超过 10^9；普通练习输入不超过 10^5 个 token，大输入专项按题面可达到
  10^6 个 token。
sample_input: 'a b

  c d e

  '
sample_output: '2 3

  '
sample_explanation: 按“每行字段数量不同”的规则解析输入，并得到上述规范化输出。
samples:
- input: 'a b

    c d e

    '
  output: '2 3

    '
  explanation: 按“每行字段数量不同”的规则解析输入，并得到上述规范化输出。
- input: 'one

    1 2 3 4

    '
  output: '1 4

    '
  explanation: 按“每行字段数量不同”的规则解析输入，并得到上述规范化输出。
learning_objective: 能够在两种 JavaScript ACM 运行模式中正确处理“每行字段数量不同”，并输出规范化结果。
v8_hint: 循环调用 `readline()`，并用 `line === undefined` 判断 EOF；空字符串不是 EOF。
nodejs_hint: 统一 CRLF 后建立行数组，用整数游标前进；不要用 `shift()` 消耗大数组。
common_errors:
- 在 JavaScript V8 模式中误用 require、process、fs 或 Buffer。
- 在 Node.js 模式中直接调用未定义的 readline() 或 print()。
- 只按单个空格 split(' ') 导致连续空白产生空 token。
- 输出调试文字、额外空格或错误的分隔符导致 Wrong Answer。
chapter: js-acm-multi-line
chapter_order: 6
prerequisites:
- js-acm-pair-per-line
estimated_minutes: 8
starter_code_v8: "const lines = [];\nfor (let line = readline(); line !== undefined; line = readline())\
  \ {\n  lines.push(line);\n}\n\n// TODO: 每行字段数量不同\nprint(lines.length);\n"
starter_code_nodejs: 'const fs = require(''fs'');


  const input = fs.readFileSync(0, ''utf8'');

  const lines = input.replace(/\r\n/g, ''\n'').split(''\n'');


  // TODO: 每行字段数量不同；请按题意决定是否移除末尾空行

  console.log(lines.length);

  '
