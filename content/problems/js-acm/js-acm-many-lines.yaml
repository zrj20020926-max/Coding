slug: js-acm-many-lines
title: 大量行
description: 本练习只训练 **大量行** 的 stdin 解析。计算步骤保持简单：按照输入结构读取数据，再输出题目要求的规范化结果。
difficulty: hard
training_category: large-input
tags:
- stdin
- stdout
- large-input
- javascript-v8
- nodejs
input_description: 输入含最多 10 万个逻辑行。
output_description: 输出逻辑行数量。 不得包含提示语或调试信息。
data_constraints: 输入为 UTF-8 文本；逻辑行使用 LF 或 CRLF。除 BigInt 专项外，整数绝对值不超过 10^9；普通练习输入不超过 10^5 个 token，大输入专项按题面可达到
  10^6 个 token。
sample_input: 'a

  b

  '
sample_output: '2

  '
sample_explanation: 按“大量行”的规则解析输入，并得到上述规范化输出。
samples:
- input: 'a

    b

    '
  output: '2

    '
  explanation: 按“大量行”的规则解析输入，并得到上述规范化输出。
- input: 'one

    two

    three

    '
  output: '3

    '
  explanation: 按“大量行”的规则解析输入，并得到上述规范化输出。
learning_objective: 能够在两种 JavaScript ACM 运行模式中正确处理“大量行”，并输出规范化结果。
v8_hint: 按行读取后使用 token 或行游标；将输出先放入数组，最后用 `print(out.join('\n'))`。
nodejs_hint: 一次读取 stdin，使用索引游标组织 token/行；将输出缓存后一次写入 stdout。
common_errors:
- 在 JavaScript V8 模式中误用 require、process、fs 或 Buffer。
- 在 Node.js 模式中直接调用未定义的 readline() 或 print()。
- 无条件 trim() 导致空行、前导空格或末尾结构丢失。
- 使用 shift() 反复移动大数组，造成不必要的二次方开销。
chapter: js-acm-large-input
chapter_order: 3
prerequisites:
- js-acm-million-tokens
estimated_minutes: 12
starter_code_v8: "const lines = [];\nfor (let line = readline(); line !== undefined; line = readline())\
  \ {\n  lines.push(line);\n}\n\n// TODO: 大量行\nprint(lines.length);\n"
starter_code_nodejs: 'const fs = require(''fs'');


  const input = fs.readFileSync(0, ''utf8'');

  const lines = input.replace(/\r\n/g, ''\n'').split(''\n'');


  // TODO: 大量行；请按题意决定是否移除末尾空行

  console.log(lines.length);

  '
time_limit_ms: 3000
memory_limit_mb: 256
source: CodeArena JavaScript ACM 原创课程
