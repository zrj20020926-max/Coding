slug: js-acm-unknown-token-count
title: 不定数量 token
description: 本练习只训练 **不定数量 token** 的 stdin 解析。计算步骤保持简单：按照输入结构读取数据，再输出题目要求的规范化结果。
difficulty: easy
training_category: single-line-multiple-values
tags:
- stdin
- stdout
- single-line-values
- javascript-v8
- nodejs
input_description: 一行包含不定数量的空白分隔整数。
output_description: 输出 token 数量和整数总和，中间一个空格。 不得包含提示语或调试信息。
data_constraints: 输入为 UTF-8 文本；逻辑行使用 LF 或 CRLF。除 BigInt 专项外，整数绝对值不超过 10^9；普通练习输入不超过 10^5 个 token，大输入专项按题面可达到
  10^6 个 token。
sample_input: '1 2 3

  '
sample_output: '3 6

  '
sample_explanation: 按“不定数量 token”的规则解析输入，并得到上述规范化输出。
samples:
- input: '1 2 3

    '
  output: '3 6

    '
  explanation: 按“不定数量 token”的规则解析输入，并得到上述规范化输出。
- input: '10 -3 5 8

    '
  output: '4 20

    '
  explanation: 按“不定数量 token”的规则解析输入，并得到上述规范化输出。
learning_objective: 能够在两种 JavaScript ACM 运行模式中正确处理“不定数量 token”，并输出规范化结果。
v8_hint: 调用一次 `readline()`；只有题意允许时才 `trim()`，空白 token 用 `/\s+/` 拆分。
nodejs_hint: 读取原始 stdin 后按题意处理第一行；不要在模板阶段无条件 `trim()`。
common_errors:
- 在 JavaScript V8 模式中误用 require、process、fs 或 Buffer。
- 在 Node.js 模式中直接调用未定义的 readline() 或 print()。
- 只按单个空格 split(' ') 导致连续空白产生空 token。
- 输出调试文字、额外空格或错误的分隔符导致 Wrong Answer。
chapter: js-acm-single-line-values
chapter_order: 10
prerequisites:
- js-acm-colon-pipe-separated
estimated_minutes: 8
starter_code_v8: "const lines = [];\nfor (let line = readline(); line !== undefined; line = readline())\
  \ {\n  lines.push(line);\n}\n\n// TODO: 不定数量 token\nprint(lines.length);\n"
starter_code_nodejs: 'const fs = require(''fs'');


  const input = fs.readFileSync(0, ''utf8'');

  const lines = input.replace(/\r\n/g, ''\n'').split(''\n'');


  // TODO: 不定数量 token；请按题意决定是否移除末尾空行

  console.log(lines.length);

  '
time_limit_ms: 1000
memory_limit_mb: 256
