slug: js-acm-character-matrix
title: 字符矩阵
description: 本练习只训练 **字符矩阵** 的 stdin 解析。计算步骤保持简单：按照输入结构读取数据，再输出题目要求的规范化结果。
difficulty: medium
training_category: matrix-input
tags:
- stdin
- stdout
- matrices
- javascript-v8
- nodejs
input_description: 第一行 n m；随后 n 行，每行 m 个空白分隔字符。
output_description: 输出字符 X 的数量。 不得包含提示语或调试信息。
data_constraints: 输入为 UTF-8 文本；逻辑行使用 LF 或 CRLF。除 BigInt 专项外，整数绝对值不超过 10^9；普通练习输入不超过 10^5 个 token，大输入专项按题面可达到
  10^6 个 token。
sample_input: '2 3

  X . X

  . X .

  '
sample_output: '3

  '
sample_explanation: 按“字符矩阵”的规则解析输入，并得到上述规范化输出。
samples:
- input: '2 3

    X . X

    . X .

    '
  output: '3

    '
  explanation: 按“字符矩阵”的规则解析输入，并得到上述规范化输出。
- input: '2 2

    a b

    X X

    '
  output: '2

    '
  explanation: 按“字符矩阵”的规则解析输入，并得到上述规范化输出。
learning_objective: 能够在两种 JavaScript ACM 运行模式中正确处理“字符矩阵”，并输出规范化结果。
v8_hint: 按行读取后使用 token 或行游标；将输出先放入数组，最后用 `print(out.join('\n'))`。
nodejs_hint: 一次读取 stdin，使用索引游标组织 token/行；将输出缓存后一次写入 stdout。
common_errors:
- 在 JavaScript V8 模式中误用 require、process、fs 或 Buffer。
- 在 Node.js 模式中直接调用未定义的 readline() 或 print()。
- 只按单个空格 split(' ') 导致连续空白产生空 token。
- 输出调试文字、额外空格或错误的分隔符导致 Wrong Answer。
chapter: js-acm-matrices
chapter_order: 3
prerequisites:
- js-acm-square-matrix
estimated_minutes: 8
starter_code_v8: "const lines = [];\nfor (let line = readline(); line !== undefined; line = readline())\
  \ {\n  lines.push(line);\n}\n\n// TODO: 字符矩阵\nprint(lines.length);\n"
starter_code_nodejs: 'const fs = require(''fs'');


  const input = fs.readFileSync(0, ''utf8'');

  const lines = input.replace(/\r\n/g, ''\n'').split(''\n'');


  // TODO: 字符矩阵；请按题意决定是否移除末尾空行

  console.log(lines.length);

  '
time_limit_ms: 1000
memory_limit_mb: 256
source: CodeArena JavaScript ACM 原创课程
