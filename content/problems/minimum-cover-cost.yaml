slug: minimum-cover-cost
title: 覆盖线段最低成本
description: 要覆盖整数线段 `[0,L]`。购买区间 `[l,r]` 可使当前已连续覆盖到 x 时扩展到 r，前提是 l<=x<r。每个区间可买一次，求最低成本；无法覆盖输出 -1。
difficulty: medium
tags:
- dynamic-programming
- interval
input_description: 第一行 `L m`，随后 m 行 `l r cost`。
output_description: 输出最低成本或 `-1`。
data_constraints: '`1 <= L <= 5000`，`1 <= m <= 20000`，`0 <= l < r <= L`，`1 <= cost <= 10^9`。'
sample_input: '10 4

  0 4 5

  3 7 4

  6 10 6

  0 10 20

  '
sample_output: '15

  '
sample_explanation: 依次购买前三个区间花费十五，比直接覆盖的二十更低。
time_limit_ms: 3000
memory_limit_mb: 512
source: CodeArena 原创题库
publish: true
reference_solutions:
  python: reference-solutions/minimum-cover-cost/solution.py
  cpp: reference-solutions/minimum-cover-cost/solution.cpp
