slug: longest-increasing-subsequence
title: 严格递增子序列
description: 求数组的最长严格递增子序列长度。子序列可删除任意元素，但不能改变剩余元素相对顺序。
difficulty: hard
tags:
- longest-increasing-subsequence
- binary-search
- dynamic-programming
input_description: 第一行 `n`，第二行 n 个整数。
output_description: 输出最长长度。
data_constraints: '`1 <= n <= 200000`，元素绝对值不超过 `10^9`。'
sample_input: '8

  10 9 2 5 3 7 101 18

  '
sample_output: '4

  '
sample_explanation: 例如 2,3,7,18 是长度四的严格递增子序列。
time_limit_ms: 1800
memory_limit_mb: 256
source: CodeArena 原创题库
publish: true
reference_solutions:
  python: reference-solutions/longest-increasing-subsequence/solution.py
  cpp: reference-solutions/longest-increasing-subsequence/solution.cpp
