slug: stable-score-sort
title: 稳定成绩排序
description: 按分数从高到低输出参赛者；分数相同时必须保持输入先后顺序。名字互不相同。
difficulty: easy
tags:
- sorting
input_description: 第一行 `n`，随后每行一个不含空格的名字和分数。
output_description: 输出排序后的名字与分数。
data_constraints: '`1 <= n <= 100000`，名字长度不超过 20，`0 <= score <= 100`。'
sample_input: '4

  lin 80

  mei 95

  yu 80

  an 60

  '
sample_output: 'mei 95

  lin 80

  yu 80

  an 60

  '
sample_explanation: 九十五分最先；同为八十分的 lin 仍在 yu 前。
time_limit_ms: 1500
memory_limit_mb: 256
source: CodeArena 原创题库
publish: true
reference_solutions:
  python: reference-solutions/stable-score-sort/solution.py
  cpp: reference-solutions/stable-score-sort/solution.cpp
