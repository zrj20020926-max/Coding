slug: zero-one-knapsack
title: 单次选择背包
description: 每件物品最多选一次，在容量限制内最大化总价值。
difficulty: medium
tags:
- zero-one-knapsack
- dynamic-programming
input_description: 第一行 `n C`，随后 `n` 行为重量和价值。
output_description: 输出最大总价值。
data_constraints: '`1 <= n <= 500`，`1 <= C <= 20000`，重量不超过 C，价值不超过 `10^9`。'
sample_input: '4 7

  2 6

  3 10

  4 12

  5 13

  '
sample_output: '22

  '
sample_explanation: 选择重量三和四的物品，价值二十二。
time_limit_ms: 2200
memory_limit_mb: 256
source: CodeArena 原创题库
publish: true
reference_solutions:
