slug: maze-shortest-steps
title: 迷宫最短步数
description: 在带障碍的网格中，从 S 出发每步上下左右移动一格，求到 T 的最少步数；不可达输出 -1。
difficulty: medium
tags:
- bfs
- shortest-path
input_description: '第一行 `n m`，随后为只含 `. # S T` 的网格，S 与 T 各一次。'
output_description: 输出最少步数或 `-1`。
data_constraints: '`1 <= n,m <= 500`，`n*m <= 250000`。'
sample_input: '3 4

  S..#

  .#..

  ...T

  '
sample_output: '5

  '
sample_explanation: 沿可通行格移动，最短路线需要五步。
time_limit_ms: 1800
memory_limit_mb: 256
source: CodeArena 原创题库
publish: true
reference_solutions:
  python: reference-solutions/maze-shortest-steps/solution.py
  cpp: reference-solutions/maze-shortest-steps/solution.cpp
