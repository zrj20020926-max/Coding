slug: graph-component-count
title: 无向图连通块
description: 统计无向图中的连通分量数量，孤立顶点也构成一个分量。
difficulty: medium
tags:
- dfs
- graph-connectivity
input_description: 第一行 `n m`，随后 `m` 行无向边 `u v`。
output_description: 输出连通分量数量。
data_constraints: '`1 <= n <= 200000`，`0 <= m <= 300000`，无自环，允许重边。'
sample_input: '6 3

  1 2

  2 3

  5 6

  '
sample_output: '3

  '
sample_explanation: 顶点 1,2,3；顶点 4；顶点 5,6 共三个分量。
time_limit_ms: 1800
memory_limit_mb: 256
source: CodeArena 原创题库
publish: true
