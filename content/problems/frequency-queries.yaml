slug: frequency-queries
title: 频次查询表
description: 建立数组元素的频次表，并回答每个查询值在数组中出现了多少次。
difficulty: easy
tags:
- hash-table
- array
input_description: 第一行 `n q`，第二行 `n` 个整数，第三行 `q` 个查询整数。
output_description: 每个查询输出一行出现次数。
data_constraints: '`1 <= n,q <= 100000`，所有数绝对值不超过 `10^9`。'
sample_input: '6 3

  1 2 2 3 2 1

  2 4 1

  '
sample_output: '3

  0

  2

  '
sample_explanation: 二出现三次，四未出现，一出现两次。
time_limit_ms: 1500
memory_limit_mb: 256
source: CodeArena 原创题库
publish: true
reference_solutions:
  python: reference-solutions/frequency-queries/solution.py
  cpp: reference-solutions/frequency-queries/solution.cpp
