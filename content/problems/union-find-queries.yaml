slug: union-find-queries
title: 动态连通查询
description: 初始有 n 个互不连通的点，在线处理合并操作和连通性询问。
difficulty: medium
tags:
- union-find
- graph-connectivity
input_description: 第一行 `n q`，随后操作为 `U a b` 或 `Q a b`。
output_description: 每个询问输出 `YES` 或 `NO`。
data_constraints: '`1 <= n,q <= 200000`，点编号 1 到 n。'
sample_input: '5 6

  Q 1 2

  U 1 2

  U 2 3

  Q 1 3

  Q 1 4

  Q 2 2

  '
sample_output: 'NO

  YES

  NO

  YES

  '
sample_explanation: 合并后 1,2,3 连通；4 仍独立；任意点与自身连通。
time_limit_ms: 1800
memory_limit_mb: 256
source: CodeArena 原创题库
publish: true
reference_solutions:
  python: reference-solutions/union-find-queries/solution.py
  cpp: reference-solutions/union-find-queries/solution.cpp
