slug: weighted-grid-route
title: 加权网格最低代价
description: 从左上角到右下角，每步上下左右移动，进入每个格子都会支付该格权值；起点权值也计入，求最小总代价。
difficulty: hard
tags:
- shortest-path
- matrix
input_description: 第一行 `n m`，随后 n 行每行 m 个正整数。
output_description: 输出最小总代价。
data_constraints: '`1 <= n,m <= 500`，`n*m <= 250000`，权值不超过 `10^9`。'
sample_input: '3 3

  1 9 1

  1 2 1

  9 1 1

  '
sample_output: '6

  '
sample_explanation: 路径 1,1,2,1,1 的总代价为六。
time_limit_ms: 3000
memory_limit_mb: 512
source: CodeArena 原创题库
publish: true
reference_solutions:
  python: reference-solutions/weighted-grid-route/solution.py
  cpp: reference-solutions/weighted-grid-route/solution.cpp
test_set:
  version: 1
  checker_type: exact
  cases:
