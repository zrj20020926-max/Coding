slug: first-occurrence
title: 第一个目标位置
description: 在非递减数组中查找目标值第一次出现的位置。
difficulty: easy
tags:
- binary-search
- array
input_description: 第一行 `n target`，第二行 `n` 个非递减整数。
output_description: 输出一基位置；不存在输出 `-1`。
data_constraints: '`1 <= n <= 200000`，整数绝对值不超过 `10^9`。'
sample_input: '7 2

  -1 2 2 2 5 8 9

  '
sample_output: '2

  '
sample_explanation: 目标值二第一次出现在第二个位置。
time_limit_ms: 1000
memory_limit_mb: 128
source: CodeArena 原创题库
publish: true
reference_solutions:
  python: reference-solutions/first-occurrence/solution.py
  cpp: reference-solutions/first-occurrence/solution.cpp
