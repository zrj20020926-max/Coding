slug: minimum-coin-count
title: 最少硬币数
description: 硬币面额可以无限次使用，凑出目标金额所需硬币数最少是多少；无法凑出输出 -1。
difficulty: medium
tags:
- dynamic-programming
input_description: 第一行 `n target`，第二行 n 个互不相同的正面额。
output_description: 输出最少硬币数或 `-1`。
data_constraints: '`1 <= n <= 100`，`0 <= target <= 100000`，面额不超过 `10^5`。'
sample_input: '3 11

  1 5 7

  '
sample_output: '3

  '
sample_explanation: 五加五加一共三枚。
time_limit_ms: 6000
memory_limit_mb: 256
source: CodeArena 原创题库
publish: true
reference_solutions:
  python: reference-solutions/minimum-coin-count/solution.py
  cpp: reference-solutions/minimum-coin-count/solution.cpp
