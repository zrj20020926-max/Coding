slug: island-count
title: 四向岛屿计数
description: 在零一网格中，四个方向相邻的陆地格属于同一岛屿，统计岛屿数量。
difficulty: medium
tags:
- bfs
- matrix
input_description: 第一行 `n m`，随后 `n` 行长度为 `m` 的零一字符串。
output_description: 输出岛屿数量。
data_constraints: '`1 <= n,m <= 500`，`n*m <= 250000`。'
sample_input: '4 5

  11000

  11010

  00100

  00011

  '
sample_output: '4

  '
sample_explanation: 左上角、中央单格、右侧单格和右下角分别形成四座岛屿。
time_limit_ms: 1800
memory_limit_mb: 256
source: CodeArena 原创题库
publish: true
reference_solutions:
  python: reference-solutions/island-count/solution.py
  cpp: reference-solutions/island-count/solution.cpp
