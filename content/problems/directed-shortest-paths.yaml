slug: directed-shortest-paths
title: 单源有向最短路
description: 给定非负权有向图，计算源点到所有顶点的最短距离；不可达点输出 -1。
difficulty: medium
tags:
- shortest-path
- graph
input_description: 第一行 `n m s`，随后 `m` 行为 `u v w`。
output_description: 输出 n 个整数。
data_constraints: '`1 <= n <= 100000`，`0 <= m <= 200000`，`0 <= w <= 10^9`。'
sample_input: '5 6 1

  1 2 4

  1 3 2

  3 2 1

  2 4 5

  3 4 8

  4 5 3

  '
sample_output: '0 3 2 8 11

  '
sample_explanation: 到 2 的最短路经过 3，最终距离为 3。
time_limit_ms: 2200
memory_limit_mb: 256
source: CodeArena 原创题库
publish: true
reference_solutions:
  python: reference-solutions/directed-shortest-paths/solution.py
  cpp: reference-solutions/directed-shortest-paths/solution.cpp
