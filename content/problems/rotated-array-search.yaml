slug: rotated-array-search
title: 旋转数组定位
description: 严格递增数组在某个位置旋转后形成新数组，查找目标值的位置。数组元素互不相同。
difficulty: medium
tags:
- binary-search
- array
input_description: 第一行 `n target`，第二行旋转后的数组。
output_description: 输出一基位置；不存在输出 `-1`。
data_constraints: '`1 <= n <= 200000`，元素绝对值不超过 `10^9`。'
sample_input: '7 2

  6 7 9 1 2 3 5

  '
sample_output: '5

  '
sample_explanation: 目标二位于第五个位置。
time_limit_ms: 1000
memory_limit_mb: 128
source: CodeArena 原创题库
publish: true
reference_solutions:
  python: reference-solutions/rotated-array-search/solution.py
  cpp: reference-solutions/rotated-array-search/solution.cpp
