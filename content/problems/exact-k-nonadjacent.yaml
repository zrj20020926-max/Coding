slug: exact-k-nonadjacent
title: 恰选非相邻元素
description: 从数组中恰好选择 k 个互不相邻的位置，使元素和最大。题目保证存在合法选择，元素可以为负。
difficulty: hard
tags:
- dynamic-programming
- array
input_description: 第一行 `n k`，第二行 n 个整数。
output_description: 输出最大元素和。
data_constraints: '`1 <= n <= 2000`，`1 <= k <= (n+1)/2`，`|a_i| <= 10^9`。'
sample_input: '6 2

  5 1 4 9 2 8

  '
sample_output: '17

  '
sample_explanation: 选择九和八，位置不相邻，和为十七。
time_limit_ms: 2600
memory_limit_mb: 256
source: CodeArena 原创题库
publish: true
reference_solutions:
  python: reference-solutions/exact-k-nonadjacent/solution.py
  cpp: reference-solutions/exact-k-nonadjacent/solution.cpp
