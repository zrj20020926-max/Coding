name: codearena-content-bootstrap-tests

services:
  postgres-content-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codearena_content_test
      POSTGRES_USER: content_test
      POSTGRES_PASSWORD: content_test_password
    ports:
      - "55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U content_test -d codearena_content_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  minio-content-test:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: contenttest
      MINIO_ROOT_PASSWORD: content_test_password
    ports:
      - "59000:9000"
      - "59001:9001"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 20

  minio-content-test-init:
    image: minio/mc:latest
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio-content-test:9000 contenttest content_test_password &&
        mc mb --ignore-existing local/codearena-content-test-data
    depends_on:
      minio-content-test:
        condition: service_healthy

  db-migrate-content-test:
    build:
      context: ./backend-api
    environment:
      DATABASE_URL: postgresql+asyncpg://content_test:content_test_password@postgres-content-test:5432/codearena_content_test
    command: ["python", "-m", "app.db.migration_bootstrap"]
    depends_on:
      postgres-content-test:
        condition: service_healthy

  content-bootstrap-test:
    build:
      context: ./backend-api
    environment:
      DATABASE_URL: postgresql+asyncpg://content_test:content_test_password@postgres-content-test:5432/codearena_content_test
      MINIO_ENDPOINT: minio-content-test:9000
      MINIO_ACCESS_KEY: contenttest
      MINIO_SECRET_KEY: content_test_password
      MINIO_TEST_DATA_BUCKET: codearena-content-test-data
      JUDGE_SUPPORTED_LANGUAGES: python,cpp
      CONTENT_TIMEZONE: Asia/Shanghai
      CONTENT_AUTO_IMPORT: "true"
    command:
      - python
      - -m
      - app.bootstrap.content
      - --manifest
      - /content/manifest.yaml
    volumes:
      - ./content:/content:ro
    depends_on:
      db-migrate-content-test:
        condition: service_completed_successfully
      minio-content-test-init:
        condition: service_completed_successfully
