name: acm-training-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acm_platform}
      POSTGRES_USER: ${POSTGRES_USER:-acm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acm_local_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis_local_password}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_local_password}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_local_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${MINIO_SOURCE_BUCKET}" &&
        mc mb --ignore-existing "local/$${MINIO_TEST_DATA_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_local_password}
      MINIO_SOURCE_BUCKET: ${MINIO_BUCKET:-codearena-submissions}
      MINIO_TEST_DATA_BUCKET: ${MINIO_TEST_DATA_BUCKET:-codearena-test-data}
    depends_on:
      minio:
        condition: service_healthy

  backend-api:
    build:
      context: ./backend-api
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-acm}:${POSTGRES_PASSWORD:-acm_local_password}@postgres:5432/${POSTGRES_DB:-acm_platform}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_local_password}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_local_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-codearena-submissions}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      SUBMISSION_SOURCE_MAX_BYTES: ${SUBMISSION_SOURCE_MAX_BYTES:-262144}
      SUBMISSION_MIN_INTERVAL_SECONDS: ${SUBMISSION_MIN_INTERVAL_SECONDS:-2}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-only-secret-key-change-before-deploy}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-14}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-lax}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
      LOGIN_RATE_LIMIT_IP_ATTEMPTS: ${LOGIN_RATE_LIMIT_IP_ATTEMPTS:-20}
      LOGIN_RATE_LIMIT_ACCOUNT_ATTEMPTS: ${LOGIN_RATE_LIMIT_ACCOUNT_ATTEMPTS:-8}
      REGISTER_RATE_LIMIT_IP_ATTEMPTS: ${REGISTER_RATE_LIMIT_IP_ATTEMPTS:-10}
      REGISTER_RATE_LIMIT_ACCOUNT_ATTEMPTS: ${REGISTER_RATE_LIMIT_ACCOUNT_ATTEMPTS:-5}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
    ports:
      - "8000:8000"
    command:
      - sh
      - -c
      - python -m app.db.migration_bootstrap && exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  outbox-publisher:
    build:
      context: ./backend-api
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-acm}:${POSTGRES_PASSWORD:-acm_local_password}@postgres:5432/${POSTGRES_DB:-acm_platform}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_local_password}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-only-secret-key-change-before-deploy}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-lax}
      SUBMISSION_STREAM_NAME: ${SUBMISSION_STREAM_NAME:-codearena:judge:submissions}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-500}
      OUTBOX_RETRY_MAX_SECONDS: ${OUTBOX_RETRY_MAX_SECONDS:-60}
      OUTBOX_DEDUP_TTL_SECONDS: ${OUTBOX_DEDUP_TTL_SECONDS:-604800}
    command: ["python", "-m", "app.workers.outbox_publisher"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-api:
        condition: service_healthy
    restart: unless-stopped

  judge-service:
    build:
      context: ./judge-service
      target: runtime
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-acm}:${POSTGRES_PASSWORD:-acm_local_password}@postgres:5432/${POSTGRES_DB:-acm_platform}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_local_password}@redis:6379/0
      SUBMISSION_STREAM_NAME: ${SUBMISSION_STREAM_NAME:-codearena:judge:submissions}
      JUDGE_CONSUMER_GROUP: ${JUDGE_CONSUMER_GROUP:-codearena-judge}
      JUDGE_CONSUMER_NAME: ${JUDGE_CONSUMER_NAME:-judge-compose-1}
      JUDGE_CLAIM_IDLE_MS: ${JUDGE_CLAIM_IDLE_MS:-60000}
      JUDGE_LOCK_TTL_MS: ${JUDGE_LOCK_TTL_MS:-600000}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_local_password}
      MINIO_SOURCE_BUCKET: ${MINIO_BUCKET:-codearena-submissions}
      MINIO_TEST_DATA_BUCKET: ${MINIO_TEST_DATA_BUCKET:-codearena-test-data}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      SANDBOX_PYTHON_IMAGE: ${SANDBOX_PYTHON_IMAGE:-python:3.12-alpine}
      SANDBOX_CPP_IMAGE: ${SANDBOX_CPP_IMAGE:-gcc:14.2-bookworm}
      SANDBOX_PULL_IMAGES: ${SANDBOX_PULL_IMAGES:-true}
      SANDBOX_CPUS: ${SANDBOX_CPUS:-0.5}
      SANDBOX_PIDS_LIMIT: ${SANDBOX_PIDS_LIMIT:-32}
      SANDBOX_DISK_LIMIT_BYTES: ${SANDBOX_DISK_LIMIT_BYTES:-67108864}
      SANDBOX_OUTPUT_LIMIT_BYTES: ${SANDBOX_OUTPUT_LIMIT_BYTES:-1048576}
      SANDBOX_OBJECT_LIMIT_BYTES: ${SANDBOX_OBJECT_LIMIT_BYTES:-16777216}
      SANDBOX_COMPILE_MEMORY_MB: ${SANDBOX_COMPILE_MEMORY_MB:-512}
      SANDBOX_COMPILE_TIMEOUT_SECONDS: ${SANDBOX_COMPILE_TIMEOUT_SECONDS:-20}
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-0}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      outbox-publisher:
        condition: service_started
    stop_grace_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "8080:80"
    depends_on:
      backend-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
