name: acm-training-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acm_platform}
      POSTGRES_USER: ${POSTGRES_USER:-acm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acm_local_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis_local_password}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_local_password}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_local_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${MINIO_SOURCE_BUCKET}" &&
        mc mb --ignore-existing "local/$${MINIO_TEST_DATA_BUCKET}" &&
        (mc admin user info local "$${AI_MINIO_ACCESS_KEY}" >/dev/null 2>&1 || mc admin user add local "$${AI_MINIO_ACCESS_KEY}" "$${AI_MINIO_SECRET_KEY}") &&
        (mc admin policy info local codearena-ai-source-readonly >/dev/null 2>&1 || mc admin policy create local codearena-ai-source-readonly /policies/ai-source-readonly-policy.json) &&
        mc admin policy attach local codearena-ai-source-readonly --user "$${AI_MINIO_ACCESS_KEY}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_local_password}
      MINIO_SOURCE_BUCKET: ${MINIO_BUCKET:-codearena-submissions}
      MINIO_TEST_DATA_BUCKET: ${MINIO_TEST_DATA_BUCKET:-codearena-test-data}
      AI_MINIO_ACCESS_KEY: ${AI_MINIO_ACCESS_KEY:-codearena-ai}
      AI_MINIO_SECRET_KEY: ${AI_MINIO_SECRET_KEY:-ai_local_password_change_me}
    volumes:
      - ./infra/minio/ai-source-readonly-policy.json:/policies/ai-source-readonly-policy.json:ro
    depends_on:
      minio:
        condition: service_healthy

  db-migrate:
    build:
      context: ./backend-api
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-acm}:${POSTGRES_PASSWORD:-acm_local_password}@postgres:5432/${POSTGRES_DB:-acm_platform}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-only-secret-key-change-before-deploy}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-lax}
    command: ["python", "-m", "app.db.migration_bootstrap"]
    depends_on:
      postgres:
        condition: service_healthy

  content-bootstrap:
    build:
      context: ./backend-api
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-acm}:${POSTGRES_PASSWORD:-acm_local_password}@postgres:5432/${POSTGRES_DB:-acm_platform}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_local_password}
      MINIO_TEST_DATA_BUCKET: ${MINIO_TEST_DATA_BUCKET:-codearena-test-data}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      TEST_DATA_OBJECT_MAX_BYTES: ${SANDBOX_OBJECT_LIMIT_BYTES:-16777216}
      JUDGE_SUPPORTED_LANGUAGES: ${JUDGE_SUPPORTED_LANGUAGES:-javascript-v8,nodejs}
      CONTENT_TIMEZONE: ${CONTENT_TIMEZONE:-Asia/Shanghai}
      CONTENT_AUTO_IMPORT: ${CONTENT_AUTO_IMPORT:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-only-secret-key-change-before-deploy}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-lax}
    command:
      - python
      - -m
      - app.bootstrap.content
      - --manifest
      - /content/manifest.yaml
    volumes:
      - ./content:/content:ro
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  backend-api:
    build:
      context: ./backend-api
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-acm}:${POSTGRES_PASSWORD:-acm_local_password}@postgres:5432/${POSTGRES_DB:-acm_platform}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_local_password}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_local_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-codearena-submissions}
      MINIO_TEST_DATA_BUCKET: ${MINIO_TEST_DATA_BUCKET:-codearena-test-data}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      TEST_DATA_OBJECT_MAX_BYTES: ${SANDBOX_OBJECT_LIMIT_BYTES:-16777216}
      SUBMISSION_SOURCE_MAX_BYTES: ${SUBMISSION_SOURCE_MAX_BYTES:-262144}
      SUBMISSION_MIN_INTERVAL_SECONDS: ${SUBMISSION_MIN_INTERVAL_SECONDS:-2}
      AI_ANALYSIS_DAILY_QUOTA: ${AI_ANALYSIS_DAILY_QUOTA:-5}
      AI_ANALYSIS_QUOTA_WINDOW_SECONDS: ${AI_ANALYSIS_QUOTA_WINDOW_SECONDS:-86400}
      JUDGE_SUPPORTED_LANGUAGES: ${JUDGE_SUPPORTED_LANGUAGES:-javascript-v8,nodejs}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-only-secret-key-change-before-deploy}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-14}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-lax}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
      LOGIN_RATE_LIMIT_IP_ATTEMPTS: ${LOGIN_RATE_LIMIT_IP_ATTEMPTS:-20}
      LOGIN_RATE_LIMIT_ACCOUNT_ATTEMPTS: ${LOGIN_RATE_LIMIT_ACCOUNT_ATTEMPTS:-8}
      REGISTER_RATE_LIMIT_IP_ATTEMPTS: ${REGISTER_RATE_LIMIT_IP_ATTEMPTS:-10}
      REGISTER_RATE_LIMIT_ACCOUNT_ATTEMPTS: ${REGISTER_RATE_LIMIT_ACCOUNT_ATTEMPTS:-5}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      CONTENT_TIMEZONE: ${CONTENT_TIMEZONE:-Asia/Shanghai}
      CONTENT_SENSITIVE_WORDS: ${CONTENT_SENSITIVE_WORDS:-赌博,色情,暴力,违法}
      DISCUSSION_MAX_REPLY_DEPTH: ${DISCUSSION_MAX_REPLY_DEPTH:-3}
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      content-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  outbox-publisher:
    build:
      context: ./backend-api
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-acm}:${POSTGRES_PASSWORD:-acm_local_password}@postgres:5432/${POSTGRES_DB:-acm_platform}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_local_password}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-only-secret-key-change-before-deploy}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-lax}
      SUBMISSION_STREAM_NAME: ${SUBMISSION_STREAM_NAME:-codearena:judge:submissions}
      AI_ANALYSIS_STREAM_NAME: ${AI_ANALYSIS_STREAM_NAME:-codearena:ai:analyses}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-500}
      OUTBOX_RETRY_MAX_SECONDS: ${OUTBOX_RETRY_MAX_SECONDS:-60}
      OUTBOX_DEDUP_TTL_SECONDS: ${OUTBOX_DEDUP_TTL_SECONDS:-604800}
    command: ["python", "-m", "app.workers.outbox_publisher"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-api:
        condition: service_healthy
    restart: unless-stopped

  judge-service:
    build:
      context: ./judge-service
      target: runtime
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-acm}:${POSTGRES_PASSWORD:-acm_local_password}@postgres:5432/${POSTGRES_DB:-acm_platform}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_local_password}@redis:6379/0
      SUBMISSION_STREAM_NAME: ${SUBMISSION_STREAM_NAME:-codearena:judge:submissions}
      JUDGE_CONSUMER_GROUP: ${JUDGE_CONSUMER_GROUP:-codearena-judge}
      JUDGE_CONSUMER_NAME: ${JUDGE_CONSUMER_NAME:-judge-compose-1}
      JUDGE_CLAIM_IDLE_MS: ${JUDGE_CLAIM_IDLE_MS:-60000}
      JUDGE_LOCK_TTL_MS: ${JUDGE_LOCK_TTL_MS:-120000}
      JUDGE_DATABASE_LEASE_SECONDS: ${JUDGE_DATABASE_LEASE_SECONDS:-120}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_local_password}
      MINIO_SOURCE_BUCKET: ${MINIO_BUCKET:-codearena-submissions}
      MINIO_TEST_DATA_BUCKET: ${MINIO_TEST_DATA_BUCKET:-codearena-test-data}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      SANDBOX_PYTHON_IMAGE: ${SANDBOX_PYTHON_IMAGE:-python:3.12-alpine}
      SANDBOX_CPP_IMAGE: ${SANDBOX_CPP_IMAGE:-gcc:14.2-bookworm}
      SANDBOX_NODE_IMAGE: ${SANDBOX_NODE_IMAGE:-node:22-alpine}
      SANDBOX_PULL_IMAGES: ${SANDBOX_PULL_IMAGES:-true}
      SANDBOX_CPUS: ${SANDBOX_CPUS:-0.5}
      SANDBOX_PIDS_LIMIT: ${SANDBOX_PIDS_LIMIT:-32}
      SANDBOX_DISK_LIMIT_BYTES: ${SANDBOX_DISK_LIMIT_BYTES:-67108864}
      SANDBOX_OUTPUT_LIMIT_BYTES: ${SANDBOX_OUTPUT_LIMIT_BYTES:-1048576}
      SANDBOX_OBJECT_LIMIT_BYTES: ${SANDBOX_OBJECT_LIMIT_BYTES:-16777216}
      SANDBOX_COMPILE_MEMORY_MB: ${SANDBOX_COMPILE_MEMORY_MB:-512}
      SANDBOX_COMPILE_TIMEOUT_SECONDS: ${SANDBOX_COMPILE_TIMEOUT_SECONDS:-20}
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-0}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      outbox-publisher:
        condition: service_started
    stop_grace_period: 20s
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
      target: runtime
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-acm}:${POSTGRES_PASSWORD:-acm_local_password}@postgres:5432/${POSTGRES_DB:-acm_platform}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_local_password}@redis:6379/0
      AI_ANALYSIS_STREAM_NAME: ${AI_ANALYSIS_STREAM_NAME:-codearena:ai:analyses}
      AI_CONSUMER_GROUP: ${AI_CONSUMER_GROUP:-codearena-ai}
      AI_CONSUMER_NAME: ${AI_CONSUMER_NAME:-ai-compose-1}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${AI_MINIO_ACCESS_KEY:-codearena-ai}
      MINIO_SECRET_KEY: ${AI_MINIO_SECRET_KEY:-ai_local_password_change_me}
      MINIO_SOURCE_BUCKET: ${MINIO_BUCKET:-codearena-submissions}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      AI_PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL:-https://api.openai.com/v1}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-5-mini}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-3}
      AI_INPUT_PRICE_USD_PER_MILLION: ${AI_INPUT_PRICE_USD_PER_MILLION:-0}
      AI_OUTPUT_PRICE_USD_PER_MILLION: ${AI_OUTPUT_PRICE_USD_PER_MILLION:-0}
      METRICS_PORT: 9102
    ports:
      - "9102:9102"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9102/metrics')"]
      interval: 15s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      outbox-publisher:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "8080:80"
    depends_on:
      backend-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
