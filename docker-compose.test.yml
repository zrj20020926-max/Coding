name: acm-training-platform-tests

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: acm_platform_test
      POSTGRES_USER: acm_test
      POSTGRES_PASSWORD: acm_test_password
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acm_test -d acm_platform_test"]
      interval: 2s
      timeout: 3s
      retries: 20
