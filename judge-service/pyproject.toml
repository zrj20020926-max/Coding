[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codearena-judge-service"
version = "0.1.0"
description = "Isolated ACM judge worker for CodeArena"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.29,<1",
  "docker>=7.1,<8",
  "minio>=7.2,<8",
  "pydantic-settings>=2.4,<3",
  "redis>=5,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "fakeredis>=2.24,<3",
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "unit: fast tests without Docker",
  "integration: tests that require a migrated PostgreSQL test database",
  "sandbox: tests that execute hostile programs in a local Docker daemon",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
