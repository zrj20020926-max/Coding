name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  judge:
    name: Judge service checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: judge-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: judge-service/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Unit tests
        run: pytest -m unit

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: acm_platform_test
          POSTGRES_USER: acm_test
          POSTGRES_PASSWORD: acm_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acm_test -d acm_platform_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://acm_test:acm_test_password@localhost:5432/acm_platform_test
    defaults:
      run:
        working-directory: backend-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend-api/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Fast unit tests
        run: pytest -m unit
      - name: PostgreSQL integration tests
        run: pytest -m integration
      - name: Judge PostgreSQL integration
        run: |
          python -m pip install -e "../judge-service"
          cd ../judge-service
          pytest -m integration

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run type-check
      - name: Vitest
        run: npm run test:run
      - name: Production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Critical browser flow
        run: npm run test:e2e
