name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ai:
    name: AI service checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Security and worker unit tests
        run: pytest -m unit

  judge:
    name: Judge service checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: judge-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: judge-service/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Unit tests
        run: pytest -m unit

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: acm_platform_test
          POSTGRES_USER: acm_test
          POSTGRES_PASSWORD: acm_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acm_test -d acm_platform_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://acm_test:acm_test_password@localhost:5432/acm_platform_test
      TEST_CONTENT_MINIO_ENDPOINT: localhost:9000
      TEST_CONTENT_MINIO_ACCESS_KEY: contenttest
      TEST_CONTENT_MINIO_SECRET_KEY: content_test_password
      TEST_CONTENT_MINIO_BUCKET: codearena-content-test-data
    defaults:
      run:
        working-directory: backend-api
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated MinIO
        run: |
          docker run -d --name codearena-content-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=contenttest \
            -e MINIO_ROOT_PASSWORD=content_test_password \
            minio/minio:latest server /data
          for attempt in {1..30}; do
            curl -fsS http://localhost:9000/minio/health/ready && exit 0
            sleep 2
          done
          docker logs codearena-content-minio
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend-api/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Fast unit tests
        run: pytest -m unit
      - name: PostgreSQL integration tests
        run: pytest -m integration
      - name: Validate Python 3.12 and C++20 reference solutions
        working-directory: .
        run: |
          docker compose -f docker-compose.content-test.yml run --build --rm catalog-validator-test
          docker compose -f docker-compose.content-test.yml run --rm catalog-cpp-validator-test
      - name: Judge PostgreSQL integration
        run: |
          python -m pip install -e "../judge-service"
          cd ../judge-service
          pytest -m integration

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run type-check
      - name: Vitest
        run: npm run test:run
      - name: Production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Critical browser flow
        run: npm run test:e2e
