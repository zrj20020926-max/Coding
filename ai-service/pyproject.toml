[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codearena-ai-service"
version = "0.1.0"
description = "Isolated, advisory AI analysis worker for CodeArena"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.29,<1",
  "httpx>=0.27,<1",
  "minio>=7.2,<8",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.4,<3",
  "redis>=5,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "fakeredis>=2.24,<3",
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["unit: fast tests without external infrastructure"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
